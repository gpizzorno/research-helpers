name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # [docs] pulls in the figures/log/sweep extras as well: autodoc imports every module to
        # read its signatures, so a missing matplotlib is a failed build, not a missing page.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        run: |
          cd docs
          make clean
          make html
        env:
          # -W turns any warning into a failure, which is what makes a broken cross-reference or
          # an undocumented new module something CI catches. Sphinx keeps going after the first
          # one on its own, so --keep-going is no longer needed (and is gone in Sphinx 9).
          SPHINXOPTS: "-W"

      - name: Check for documentation errors
        run: |
          cd docs
          if [ -d "_build/html" ]; then
            echo "Documentation built successfully"
            ls -lah _build/html/
          else
            echo "Documentation build failed!"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy documentation from ${{ github.sha }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-html
          path: docs/_build/html/
          retention-days: 30
